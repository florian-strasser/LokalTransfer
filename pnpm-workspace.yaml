# The documentation site is its own Nuxt project, deployed separately as static
# files — but it is a workspace member rather than a detached install, so one
# `pnpm install` covers both and the security overrides below apply to its
# dependencies too. A standalone install would need its own lockfile and its own
# audit, and would quietly miss every pin made here.
packages:
  - docs

allowBuilds:
  '@parcel/watcher': false
  # @nuxt/content stores the parsed Markdown in SQLite, so the docs site cannot
  # build without this one's native module.
  better-sqlite3: true
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# Security overrides for transitive dependencies. Every one of these arrives
# through something else — none are packages this project imports — so they are
# pinned here rather than by bumping a direct dependency.
#
# Ranges are scoped to the affected major line, so a package already outside the
# advisory (esbuild 0.25.x, brace-expansion 1.x) is not dragged across a major
# boundary for nothing.
#
# pnpm 11 reads overrides from this file; the `pnpm.overrides` key in
# package.json is silently ignored, which is worth knowing because an override
# written there looks applied and simply is not.
overrides:
  shell-quote@<1.10.0: ^1.10.0
  tar@<7.5.22: ^7.5.22
  # The one forced major bump. The advisory for !!omap resolution states the fix
  # was not backported to 3.x or 4.x, so staying on 4 cannot clear it.
  js-yaml@4: ^5.3.0
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  nanoid@3: ^3.3.18
  svgo@4: ^4.1.0
  # Reached through nuxt, @nuxt/ui, @nuxt/eslint and @nuxtjs/mcp-toolkit.
  hono@4: ^4.13.5
  launch-editor@<2.14.1: ^2.14.1
  esbuild@>=0.27.3 <0.28.1: ^0.28.2
  '@babel/core@7': ^7.29.7
  # Reached through ajv, which asks for ^3.0.1 — the range already allows the
  # fix, the lockfile was simply holding an older resolution.
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  # Via express/body-parser. Scoped to the affected window so a copy outside it
  # is left where it is.
  qs@>=6.14.2 <=6.15.3: ^6.16.0
  # Tiptap arrives as auto-installed *peers* of @nuxt/ui, declared as `^3` — so
  # the advisory version satisfies the range and nothing will ever move it on its
  # own. Every package has to be listed because they peer-pin @tiptap/core to an
  # exact version: raising core alone leaves 36 siblings demanding the old one.
  '@tiptap/core@3': ^3.30.4
  '@tiptap/extension-blockquote@3': ^3.30.4
  '@tiptap/extension-bold@3': ^3.30.4
  '@tiptap/extension-bubble-menu@3': ^3.30.4
  '@tiptap/extension-bullet-list@3': ^3.30.4
  '@tiptap/extension-code@3': ^3.30.4
  '@tiptap/extension-code-block@3': ^3.30.4
  '@tiptap/extension-collaboration@3': ^3.30.4
  '@tiptap/extension-document@3': ^3.30.4
  '@tiptap/extension-drag-handle@3': ^3.30.4
  '@tiptap/extension-drag-handle-vue-3@3': ^3.30.4
  '@tiptap/extension-dropcursor@3': ^3.30.4
  '@tiptap/extension-floating-menu@3': ^3.30.4
  '@tiptap/extension-gapcursor@3': ^3.30.4
  '@tiptap/extension-hard-break@3': ^3.30.4
  '@tiptap/extension-heading@3': ^3.30.4
  '@tiptap/extension-horizontal-rule@3': ^3.30.4
  '@tiptap/extension-image@3': ^3.30.4
  '@tiptap/extension-italic@3': ^3.30.4
  '@tiptap/extension-link@3': ^3.30.4
  '@tiptap/extension-list@3': ^3.30.4
  '@tiptap/extension-list-item@3': ^3.30.4
  '@tiptap/extension-list-keymap@3': ^3.30.4
  '@tiptap/extension-mention@3': ^3.30.4
  '@tiptap/extension-node-range@3': ^3.30.4
  '@tiptap/extension-ordered-list@3': ^3.30.4
  '@tiptap/extension-paragraph@3': ^3.30.4
  '@tiptap/extension-placeholder@3': ^3.30.4
  '@tiptap/extension-strike@3': ^3.30.4
  '@tiptap/extension-text@3': ^3.30.4
  '@tiptap/extension-underline@3': ^3.30.4
  '@tiptap/extensions@3': ^3.30.4
  '@tiptap/markdown@3': ^3.30.4
  '@tiptap/pm@3': ^3.30.4
  '@tiptap/starter-kit@3': ^3.30.4
  '@tiptap/suggestion@3': ^3.30.4
  '@tiptap/vue-3@3': ^3.30.4
